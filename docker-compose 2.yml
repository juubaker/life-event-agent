services:
  postgres:
    image: pgvector/pgvector:pg16   # pgvector ready for the RAG step
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: life_event
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d life_event"]
      interval: 2s
      retries: 15
volumes:
  pgdata:

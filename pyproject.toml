[project]
name = "life-event-agent"
version = "0.1.0"
description = "LangGraph HR life-event case agent with human-in-the-loop approval and durable Postgres checkpoints"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "langchain-anthropic>=0.3",
  "langchain-ollama>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
life-event = "life_event_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_event_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
